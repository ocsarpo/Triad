<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="120" y1="90" x2="900" y2="940" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#29243F"/>
      <stop offset="0.52" stop-color="#1D1D2A"/>
      <stop offset="1" stop-color="#15171F"/>
    </linearGradient>
    <linearGradient id="leftArc" x1="150" y1="260" x2="360" y2="720" gradientUnits="userSpaceOnUse">
