<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="126" y1="92" x2="900" y2="936" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#28233C"/>
      <stop offset="0.5" stop-color="#1D1D2A"/>
      <stop offset="1" stop-color="#14161E"/>
    </linearGradient>
    <linearGradient id="blue" x1="174" y1="220" x2="380" y2="708" gradientUnits="userSpaceOnUse">
      <stop stop-color="#82B2FF"/>
      <stop offset="1" stop-color="#3978ED"/>
    </linearGradient>
    <linearGradient id="orange" x1="850" y1="264" x2="658" y2="752" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFAA80"/>
      <stop offset="1" stop-color="#D36338"/>
    </linearGradient>
    <linearGradient id="violet" x1="278" y1="668" x2="746" y2="850" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B49AF4"/>
      <stop offset="1" stop-color="#7758CF"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="62" y="62" width="900" height="900" rx="210" fill="url(#background)"/>
  <rect x="72" y="72" width="880" height="880" rx="200" fill="none" stroke="#FFFFFF" stroke-opacity="0.075" stroke-width="4"/>

  <!-- Three equal inward-facing arcs, rotated as a single triad to avoid a face-like reading. -->
  <g transform="rotate(-22 512 512)" fill="none" stroke-width="82" stroke-linecap="round" filter="url(#softGlow)">
    <path d="M 348 236 C 160 310, 160 606, 348 680" stroke="url(#blue)"/>
    <path d="M 676 236 C 864 310, 864 606, 676 680" stroke="url(#orange)"/>
    <path d="M 286 680 C 374 884, 650 884, 738 680" stroke="url(#violet)"/>
  </g>
</svg>
